name: Daily Data Update

on:
  schedule:
    # Runs at 10:30 PM IST (17:00 UTC) every day
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the updated database back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use a stable version compatible with your code

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update pipeline
        run: python src/update_daily.py

      - name: Send Telegram score alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/telegram_alerts.py
        continue-on-error: true

      - name: Commit and push updated database
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add database/stocks.db
          # Only commit if there are changes to avoid unnecessary redeploys
          git diff --staged --quiet || git commit -m "Automated daily database update [skip ci]"
          git push